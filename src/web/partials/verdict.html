<!-- VERDICT ------------------------------------------------ -->
    <section class="card card-verdict" aria-labelledby="verdict-heading">
      <div class="eyebrow-row">
        <p class="eyebrow" id="verdict-scope">Whole range</p>
        <p class="eyebrow eyebrow-quiet" id="verdict-basis"></p>
      </div>
      <h1 class="verdict" id="verdict-heading" aria-live="polite">
        <span class="verdict-icon" id="verdict-icon" aria-hidden="true"></span>
        <span id="verdict-text">Loading&hellip;</span>
      </h1>
      <p class="verdict-detail" id="verdict-detail"></p>

      <figure class="scale-figure">
        <figcaption class="figure-head">
          <h2 class="figure-title">Where this sits on the price-sensitivity scale</h2>
          <p class="figure-note">
            The <button type="button" class="term" data-term="breakeven">break-even line</button>
            is where a price change leaves revenue untouched.
          </p>
        </figcaption>
        <div class="scale-host" id="scale-chart"></div>
      </figure>
    </section>
