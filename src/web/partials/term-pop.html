<!-- term definition popover, moved next to whichever term opened it -->
<div class="term-pop" id="term-pop" role="dialog" aria-labelledby="term-pop-title" hidden>
  <h4 id="term-pop-title"></h4>
  <p id="term-pop-body"></p>
  <button type="button" class="term-pop-close" id="term-pop-close">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    <span class="sr-only">Close definition</span>
  </button>
</div>

<div class="sr-only" id="live-region" role="status" aria-live="polite"></div>
