<!-- COMPARISON ---------------------------------------------- -->
    <section class="card" aria-labelledby="compare-heading">
      <div class="card-head">
        <h2 class="card-title" id="compare-heading">How categories compare</h2>
        <p class="card-sub">
          Everything left of the break-even line grows revenue when you discount.
          Your current pick is highlighted.
        </p>
      </div>
      <figure class="chart-figure">
        <figcaption class="figure-head figure-head-end">
          <div class="figure-actions">
            <button type="button" class="btn btn-quiet btn-table" data-table-toggle="compare-table"
                    aria-expanded="false" aria-controls="compare-table">Table</button>
          </div>
        </figcaption>
        <div class="chart-host" id="compare-chart"></div>
        <div class="table-view" id="compare-table" hidden></div>
      </figure>
      <p class="hint" id="compare-note"></p>
    </section>
