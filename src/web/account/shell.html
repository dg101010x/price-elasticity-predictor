<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>{{TITLE}} &mdash; Price Sensitivity Lab</title>
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="light dark" />
<link rel="preload" as="font" type="font/woff2" href="/fonts/archivo-400-700.woff2" crossorigin />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232a78d6'/%3E%3Cpath d='M4 17.5 9.5 12l3.5 3 6-6.5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M14.5 8h4.5v4.5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>/*__APP_CSS__*/
/*__ACCOUNT_CSS__*/</style>
</head>
<body data-theme-pref="system" data-page="{{PAGE}}">

<a class="skip-link" href="#main">Skip to content</a>

<header class="masthead">
  <div class="shell masthead-inner">
    <a class="brand" href="{{HOME}}">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17.5 9 11l4 3.5 7.5-8" /><path d="M15 6.5h5.5V12" />
        </svg>
      </span>
      <span class="brand-text">
        <strong>Price Sensitivity Lab</strong>
        <span class="brand-sub">{{BRAND_SUB}}</span>
      </span>
    </a>
    <div class="masthead-tools">
      {{ACCOUNT_TOOLS}}
      <div class="theme-toggle" role="group" aria-label="Colour theme">
        <button type="button" data-theme-set="light" aria-pressed="false" title="Light theme">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="sr-only">Light</span>
        </button>
        <button type="button" data-theme-set="system" aria-pressed="true" title="Match system theme">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 21h7"/></svg>
          <span class="sr-only">System</span>
        </button>
        <button type="button" data-theme-set="dark" aria-pressed="false" title="Dark theme">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
          <span class="sr-only">Dark</span>
        </button>
      </div>
    </div>
  </div>
  {{NAV}}
</header>

<main id="main" class="shell page page-{{PAGE}}">
{{BODY}}
</main>

<!--@partial term-pop-->

<script>window.PSL_CONFIG = /*__CONFIG__*/;</script>
/*__SCRIPTS__*/
</body>
</html>
